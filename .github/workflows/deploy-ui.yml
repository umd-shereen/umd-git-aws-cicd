name: Deploy Amusema Production UI

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: amusema-production-ui
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"
  BUILD_DIRECTORY: "dist"

jobs:
  build-and-deploy:
    name: Build and deploy production UI
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build
        env:
          CI: false
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "${BUILD_DIRECTORY}" ]; then
            echo "::error::Build directory '${BUILD_DIRECTORY}' does not exist."
            exit 1
          fi

          if [ ! -f "${BUILD_DIRECTORY}/index.html" ]; then
            echo "::error::${BUILD_DIRECTORY}/index.html does not exist."
            exit 1
          fi

          echo "Build output verified."
          ls -la "${BUILD_DIRECTORY}"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-amusema-prod-ui
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate deployment variables
        shell: bash
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          if [ -z "${AWS_S3_BUCKET}" ]; then
            echo "::error::AWS_S3_BUCKET is not configured."
            exit 1
          fi

          if [ -z "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "::error::AWS_CLOUDFRONT_DISTRIBUTION_ID is not configured."
            exit 1
          fi

      - name: Upload versioned assets
        shell: bash
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          set -euo pipefail

          aws s3 sync "${BUILD_DIRECTORY}/" "s3://${AWS_S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        shell: bash
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          set -euo pipefail

          aws s3 cp "${BUILD_DIRECTORY}/index.html" \
            "s3://${AWS_S3_BUCKET}/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        shell: bash
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          echo "CloudFront invalidation created: ${INVALIDATION_ID}"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

          echo "CloudFront invalidation completed."

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment completed"
            echo ""
            echo "- AWS region: \`${{ vars.AWS_REGION }}\`"
            echo "- S3 bucket: \`${{ vars.AWS_S3_BUCKET }}\`"
            echo "- CloudFront distribution: \`${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

