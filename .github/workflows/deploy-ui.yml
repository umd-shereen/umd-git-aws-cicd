name: Amusema UI CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amusema-ui-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ui-dist
          path: dist
          if-no-files-found: error

  deploy:
  name: Deploy to AWS
  needs: validate
  runs-on: ubuntu-latest

  if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  environment:
    name: production

  permissions:
    contents: read
    id-token: write

  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        audience: sts.amazonaws.com

      - name: Upload hashed assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html without long-term caching
        run: |
          aws s3 cp dist/index.html \
            "s3://${{ vars.AWS_S3_BUCKET }}/index.html" \
            --content-type text/html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
